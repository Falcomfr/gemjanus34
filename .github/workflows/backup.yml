name: Sauvegarde

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backup.mjs --out backups/sauvegarde
        env:
          JANUS_SUPABASE_TOKEN: ${{ secrets.JANUS_SUPABASE_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ github.run_id }}
          path: backups/sauvegarde
          retention-days: 90
          if-no-files-found: error
